<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Write a Post</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script>const savedTheme = localStorage.getItem('theme'); if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);</script>
</head>
<body>
    <div id="lock-screen" style="display: flex; height: 100vh; align-items: center; justify-content: center; flex-direction: column;">
        <h2 style="font-family: var(--font-heading); margin-bottom: 20px; color: var(--text-main);">Restricted Area</h2>
        <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem;">Enter passcode to unlock the editor.</p>
        <input type="password" id="passcode" placeholder="Passcode" class="form-input" style="margin-bottom: 15px; width: 250px; text-align: center;">
        <button onclick="unlock()" class="btn-primary" style="width: 250px; justify-content: center;">Unlock</button>
    </div>

    <main id="admin-panel" style="display: none; max-width: 800px; margin: 0 auto; padding: 40px 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 class="section-title" style="margin: 0;">Write a New Post</h2>
            <a href="/" class="btn-secondary"><i class="fa-solid fa-arrow-left"></i> Back</a>
        </div>

        <form id="post-form" style="display: flex; flex-direction: column;">
            <div style="background: var(--bg-card); padding: 15px; border-radius: 6px; border: 1px solid var(--border-color); margin-bottom: 15px;">
                <label class="admin-label">GitHub Token (saved locally)</label>
                <input type="password" id="github-token" placeholder="github_pat_..." required class="admin-input" style="margin-bottom: 0;">
            </div>

            <label class="admin-label">Title</label>
            <input type="text" id="post-title" placeholder="My Awesome Project" required class="admin-input">

            <div class="admin-grid">
                <div>
                    <label class="admin-label">Date</label>
                    <input type="date" id="post-date" required class="admin-input">
                </div>
                <div>
                    <label class="admin-label">Type</label>
                    <select id="post-type" class="admin-input">
                        <option value="notes">Notes</option>
                        <option value="project">Project Log</option>
                    </select>
                </div>
            </div>

            <label class="admin-label">Description (1 sentence)</label>
            <input type="text" id="post-desc" placeholder="A short summary..." required class="admin-input">

            <div class="admin-grid">
                <div>
                    <label class="admin-label">Project Slug (optional)</label>
                    <input type="text" id="post-project" placeholder="e.g. infra-lab" class="admin-input">
                </div>
                <div>
                    <label class="admin-label">Tags (comma separated)</label>
                    <input type="text" id="post-tags" placeholder="docker, linux" class="admin-input">
                </div>
            </div>

            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
                <input type="checkbox" id="post-featured" style="transform: scale(1.5);">
                <label for="post-featured" style="color: var(--text-main); font-size: 0.95rem; cursor: pointer;">Feature this post on the homepage?</label>
            </div>

            <label class="admin-label">Content (Markdown)</label>
            <textarea id="post-content" rows="15" placeholder="Write your markdown here..." required class="admin-textarea"></textarea>

            <button type="submit" class="btn-primary" id="submit-btn" style="width: 100%; justify-content: center; padding: 15px; font-size: 1rem;">
                <i class="fa-solid fa-paper-plane"></i> Publish Post
            </button>
            <p id="form-status" style="text-align: center; margin-top: 10px; font-family: var(--font-mono);"></p>
        </form>
    </main>

    <script>
        const SECRET_PASSCODE = "kevzkip2026";
        function unlock() {
            if (document.getElementById('passcode').value === SECRET_PASSCODE) {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
            } else {
                alert("Incorrect passcode.");
            }
        }
    </script>
    <script src="/blog-admin/admin.js"></script>
</body>
</html>
